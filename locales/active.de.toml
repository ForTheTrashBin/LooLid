#------------------------------------------------------------------------------

[flag.mainUsageMessage]
other = """
'{{.pureAppName}}' ist ein Werkzeug, welches einen gegebenen Verzeichnisbaum umwandeln kann.

Anwendung:

	{{.pureAppName}} Kommando [flags]

Die möglichen Kommandos sind:

	build		Generiere Ausgabe
	serve		Generiere Ausgabe und starte einen web-server
	version		Ausgabe der Versionsinformation

Benutze "{{.pureAppName}} [Kommando] --help" für mehr Informationen über ein bestimmtes Kommando.
"""

#------------------------------------------------------------------------------

[flag.buildUsageMessage]
other = """
Anwendung: {{.pureAppName}} build

Wandelt den Inhalt eines bestimmten Verzeichnisses unter Anwendung komplexer
Transformationsregeln in ein anderes Verzeichnis um. In jedem einzelnen Unter-
verzechnis kann eine Konfigurationsdatei '{{.configFileName}}' angegeben werden,
mit der die Funktionsweise des Programms gezielt gesteuert werden kann.

Beispiel:
	{{.pureAppName}} build
"""

#------------------------------------------------------------------------------

[flag.serveUsageMessage]
other = """
Anwendung: {{.pureAppName}} serve [Schalter]

Wandelt den Inhalt eines bestimmten Verzeichnisses unter Anwendung komplexer
Transformationsregeln in ein anderes Verzeichnis um. In jedem einzelnen Unter-
verzechnis kann eine Konfigurationsdatei '{{.configFileName}}' angegeben werden,
mit der die Funktionsweise des Programms gezielt gesteuert werden kann.

Schalter:

	-p	-port	The port the server is listening on (default: 3000)
	-u	-update	???????

Beispiel:
	{{.pureAppName}} serve -p 8080
"""

#------------------------------------------------------------------------------

[flag.versionUsageMessage]
other = """
Anwendung: {{.pureAppName}} version

Zeigt die aktuelle Version der laufenden {{.pureAppName}}-Anwendung an.

Beispiel:
	{{.pureAppName}} version
"""

