[flag.mainUsageMessage]
other = """
'{{.pureAppName}}' is a specialized tool that can transform a given directory tree.

Usage:

	{{.pureAppName}} command [flags]

The commands are:

	build		Generate output
	serve		Generate output and start a web server
	version		Display version

Use "{{.pureAppName}} [command] --help" for more information about a command.
"""

[flag.buildUsageMessage]
other = """
Usage: {{.pureAppName}} build

Converts the contents of a specific directory into another directory
using complex transformation rules. The configuration is read from the
'{{.pureAppName}}.config' file, which is located in the current
working directory. Otherwise, the default settings are used.

Example:
	{{.pureAppName}} build
"""

[flag.serveUsageMessage]
other = """
Usage: {{.pureAppName}} serve [flags]

Converts the contents of a specific directory into another directory
using complex transformation rules. Starts a web server so that the
content can be accessed. The configuration is read from the
'{{.pureAppName}}.config' file, which is located in the current
working directory. Otherwise, the default settings are used.

Flags:

	-p	-port	The port the server is listening on (default: 3000)
	-u	-update	???????

Example:
	{{.pureAppName}} serve -p 8080
"""

[flag.versionUsageMessage]
other = """
Usage: {{.pureAppName}} version

Displays the current version of the {{.pureAppName}}-application that is running.

Example:
	{{.pureAppName}} version
"""

